[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "takeoff-builder-challenge"
version = "0.1.0"
description = "Backend-oriented prototype for the AI Takeoff Builder Challenge"
requires-python = ">=3.11"

[project.scripts]
takeoff-app = "takeoff_builder.app:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
takeoff_builder = ["web/*"]
